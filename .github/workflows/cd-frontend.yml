name: CD - Frontend

on:
  push:
    branches: [develop] #[main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Notify Discord (success)
        if: success()
        run: |
          curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "✅ 프론트엔드 배포 성공" \
              --arg desc "${{ github.event.head_commit.message }}" \
              --arg sha "${{ github.sha }}" \
              '{embeds: [{title: $title, description: $desc, color: 65280, fields: [{name: "Commit", value: $sha}]}]}')"

      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "❌ 프론트엔드 배포 실패" \
              --arg desc "${{ github.event.head_commit.message }}" \
              --arg sha "${{ github.sha }}" \
              '{embeds: [{title: $title, description: $desc, color: 16711680, fields: [{name: "Commit", value: $sha}]}]}')"
