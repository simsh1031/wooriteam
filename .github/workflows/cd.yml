name: CD - Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'Dockerfile'
      - '.github/workflows/cd.yml'

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_NAME: wooriteam

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repository URI
        id: ecr-repo
        run: |
          URI=$(aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY_NAME }}" \
            --query 'repositories[0].repositoryUri' --output text)
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ steps.ecr-repo.outputs.uri }}:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-repo.outputs.uri }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Push image to ECR
        run: |
          docker push ${{ steps.ecr-repo.outputs.uri }}:${{ github.sha }}
          docker tag ${{ steps.ecr-repo.outputs.uri }}:${{ github.sha }} ${{ steps.ecr-repo.outputs.uri }}:latest
          docker push ${{ steps.ecr-repo.outputs.uri }}:latest

      # TODO: ECS Task Definition 등록 + 서비스 업데이트 + 스모크 테스트 + 롤백 + Discord 알림
